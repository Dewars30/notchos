name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: --features macos-private-api
          - os: macos-latest
            target: x86_64-apple-darwin
            features: --features macos-private-api
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci
        working-directory: notchos

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: notchos
          tagName: v__VERSION__
          releaseName: 'NotchOS v__VERSION__'
          releaseBody: 'Air traffic control for your AI agents.'
          releaseDraft: false
          args: ${{ matrix.features }} --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release download "v${VERSION}" \
            --repo Dewars30/notchos \
            --pattern "*.dmg" \
            --dir /tmp/release
          ls -la /tmp/release/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA256
        id: sha
        run: |
          ARM_DMG=$(ls /tmp/release/*aarch64*.dmg 2>/dev/null | head -1)
          INTEL_DMG=$(ls /tmp/release/*x64*.dmg 2>/dev/null || ls /tmp/release/*x86_64*.dmg 2>/dev/null | head -1)
          if [ -n "$ARM_DMG" ]; then
            echo "arm=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')" >> $GITHUB_OUTPUT
          fi
          if [ -n "$INTEL_DMG" ]; then
            echo "intel=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')" >> $GITHUB_OUTPUT
          fi

      - name: Update Homebrew cask
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ARM_SHA=${{ steps.sha.outputs.arm }}
          INTEL_SHA=${{ steps.sha.outputs.intel }}

          gh repo clone Dewars30/homebrew-notchos /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/notchos.rb << CASK_EOF
          cask "notchos" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA:-PENDING}",
                   intel: "${INTEL_SHA:-PENDING}"

            url "https://github.com/Dewars30/notchos/releases/download/v#{version}/NotchOS_#{version}_#{arch}.dmg"
            name "NotchOS"
            desc "Air traffic control for your AI agents"
            homepage "https://github.com/Dewars30/notchos"

            depends_on macos: ">= :ventura"

            app "NotchOS.app"

            postflight do
              ohai "Launch NotchOS to complete setup. It will configure Claude Code hooks automatically."
            end

            zap trash: [
              "~/.notchos",
            ]
          end
          CASK_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/notchos.rb
          git commit -m "bump: NotchOS v${VERSION}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
